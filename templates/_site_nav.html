{% set _path = request.path if request else '' %}
<div class="site-nav">
  <a href="/" class="site-nav-brand">
    <span class="brand-glyph">✦</span>
    DeityDB
  </a>
  <nav class="site-nav-links" id="site-nav-links">
    <a href="/explore"   class="nav-link{% if _path == '/explore' %} active{% endif %}">Browse</a>
    <a href="/graph"     class="nav-link{% if _path == '/graph' %} active{% endif %}">Graph</a>
    <a href="/connections" class="nav-link{% if _path == '/connections' %} active{% endif %}">Connections</a>
    <a href="/timeline"  class="nav-link{% if _path == '/timeline' %} active{% endif %}">Timeline</a>
    <a href="/chain"     class="nav-link{% if _path == '/chain' %} active{% endif %}">Lineages</a>
    <a href="/path"      class="nav-link{% if _path == '/path' %} active{% endif %}">Path</a>
    <a href="/constellation" class="nav-link{% if _path == '/constellation' %} active{% endif %}">Map</a>
    <a href="/deitydb"   class="nav-link{% if _path.startswith('/deitydb') %} active{% endif %}">Queries</a>
    <span class="nav-sep" aria-hidden="true"></span>
    <a href="/about"     class="nav-link nav-link-meta{% if _path == '/about' %} active{% endif %}">About</a>
    <a href="/contribute" class="nav-link nav-link-meta{% if _path == '/contribute' %} active{% endif %}">Collaborate</a>
    <a href="/api"       class="nav-link nav-link-meta{% if _path == '/api' %} active{% endif %}">API</a>
    <a href="https://github.com/jebboone/deitydb" class="nav-link nav-link-ext"
       target="_blank" rel="noopener noreferrer">GitHub&nbsp;↗</a>
  </nav>
  <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
</div>
<script>
(function() {
  var toggle = document.getElementById('nav-toggle');
  var links  = document.getElementById('site-nav-links');
  toggle.addEventListener('click', function() { links.classList.toggle('open'); });
  links.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() { links.classList.remove('open'); });
  });
})();
</script>
