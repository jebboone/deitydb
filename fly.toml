# fly.toml app configuration file generated for deitydb-explorer on 2026-06-13T19:25:20-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'deitydb-explorer'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']


[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
